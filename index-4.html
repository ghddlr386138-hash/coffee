<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴포즈커피 칠원하모니점 메뉴판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #FDB71A 0%, #FFA500 100%);
            font-family: 'Noto Sans KR', sans-serif;
        }
        .header {
            background: black;
            color: #FDB71A;
            user-select: none;
            cursor: pointer;
        }
        .menu-section {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .category-btn {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .category-btn:hover {
            transform: scale(1.05);
        }
        .category-btn.active {
            background: #1e293b;
            color: white;
        }
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }
        .admin-content {
            background: white;
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .menu-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- Header -->
        <div id="header" class="header text-center py-6 rounded-2xl mb-6 shadow-2xl">
            <h1 class="text-4xl font-bold mb-2">☕ COMPOSE COFFEE</h1>
            <h2 class="text-2xl">컴포즈커피 칠원하모니점</h2>
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap gap-3 mb-6 justify-center">
            <button class="category-btn active px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="all">전체 메뉴</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="coffee">커피</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="coldbrew">콜드브루</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="decaf_coffee">디카페인 커피</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="decaf_coldbrew">디카페인 콜드브루</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="latte">논커피 라떼</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="tea">티</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="tea_beverage">티 음료</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="ade">에이드</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="juice">주스</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="smoothie">스무디</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="frappe">프라페</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="shake">밀크쉐이크</button>
            <button class="category-btn px-6 py-3 rounded-full bg-white font-bold shadow-lg" data-category="combo">베스트 컴포즈 콤보</button>
        </div>

        <!-- Search Bar -->
        <div class="mb-6">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="🔍 카테고리 검색... (예: 커피, 라떼)" 
                class="w-full px-6 py-4 text-lg rounded-xl shadow-lg border-2 border-gray-200 focus:border-yellow-500 focus:outline-none"
            />
        </div>

        <!-- Menu Image Display -->
        <div class="menu-section mb-8">
            <div id="menuDisplay" class="menu-image-container">
                <img src="./menu-image.jpeg" alt="컴포즈커피 메뉴판" id="menuImage">
            </div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="admin-modal">
        <div class="admin-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold">🔧 관리자 모드</h2>
                <button id="closeAdmin" class="text-3xl hover:text-red-500">&times;</button>
            </div>

            <!-- QR Code Section -->
            <div class="mb-8 p-6 bg-blue-50 rounded-xl">
                <h3 class="text-xl font-bold mb-4">📱 메뉴판 QR 코드</h3>
                <div id="qrcode" class="flex justify-center mb-4"></div>
                <p class="text-gray-600 text-center">QR 코드를 스캔하여 메뉴를 확인하세요</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // 카테고리별 이미지 매핑
        const categoryImages = {
            'all': './menu-image.jpeg',
            'coffee': './커피.jpeg',
            'coldbrew': './콜드브루.jpeg',
            'decaf_coffee': './디카페인커피.jpeg',
            'decaf_coldbrew': './디카페인_콜드브루.jpeg',
            'latte': './논커피.jpeg',
            'tea': './티.jpeg',
            'tea_beverage': './티음료.jpeg',
            'ade': './에이트.jpeg',
            'juice': './주스.jpeg',
            'smoothie': './스무디.jpeg',
            'frappe': './프라페.jpeg',
            'shake': './MLKSHAE_.jpeg',
            'combo': './베스트_컴포즈_콤보.jpeg'
        };

        // 카테고리 버튼 클릭
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 모든 버튼 비활성화
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                
                // 클릭한 버튼 활성화
                this.classList.add('active');
                
                const category = this.dataset.category;
                const imageFile = categoryImages[category] || './menu-image.jpeg';
                
                // 이미지 변경
                document.getElementById('menuImage').src = imageFile;
            });
        });

        // 검색 기능 - 카테고리 버튼 필터링
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                const text = btn.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    btn.style.display = 'inline-block';
                } else {
                    btn.style.display = 'none';
                }
            });
        });

        // 관리자 모드 - 헤더 더블클릭
        document.getElementById('header').addEventListener('dblclick', function() {
            const password = prompt('🔒 관리자 비밀번호를 입력하세요:');
            if (password === 'compose2024') {
                document.getElementById('adminModal').style.display = 'block';
                
                // QR 코드 생성
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById("qrcode"), {
                    text: window.location.href,
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff"
                });
            } else if (password !== null) {
                alert('❌ 비밀번호가 틀렸습니다!');
            }
        });

        // 관리자 모드 닫기
        document.getElementById('closeAdmin').addEventListener('click', function() {
            document.getElementById('adminModal').style.display = 'none';
        });
    </script>
</body>
</html>
